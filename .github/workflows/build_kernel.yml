name: Build Compact Android 12 Kernel with Camera Fix

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev bison flex libssl-dev bc ccache git lzop lz4 device-tree-compiler

      - name: Clone Google Android GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain

      - name: Clone kOtusin Lineage 19.1 Kernel Source
        run: |
          git clone --depth=1 https://github.com/kOtusin/android_kernel_samsung_exynos3475.git -b lineage-19.1 kernel

      - name: Apply Camera FLITE IRQ Sharing and DTS Standby Patches
        run: |
          cd kernel

          # Patch Camera FIMC-IS FLITE IRQF_SHARED (fixes FD leak on /dev/video101)
          find drivers/media/ -name "*flite*.c" -exec sed -i 's/request_irq(\([^,]*\), \([^,]*\), 0,/request_irq(\1, \2, IRQF_SHARED,/g' {} +
          find drivers/media/ -name "*sensor*.c" -exec sed -i 's/request_irq(\([^,]*\), \([^,]*\), 0,/request_irq(\1, \2, IRQF_SHARED,/g' {} +

          # Patch Device Tree Camera GPIO Standby Pins to GPF0
          find arch/arm/boot/dts/ -name "*3475*.dts*" -exec sed -i 's/gpio_standby = <&gpc2 [0-9] [0-9]>/gpio_standby = <\&gpf0 2 1>/g' {} +

          # Disable exFAT (GCC 4.9 compile issue)
          sed -i '/CONFIG_EXFAT_FS/d' arch/arm/configs/lineage-j1xlte_defconfig
          echo "# CONFIG_EXFAT_FS is not set" >> arch/arm/configs/lineage-j1xlte_defconfig

      - name: Generate .config, Force LZO Compression, then Build
        run: |
          cd kernel
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-

          # Step 1: Generate base .config
          make lineage-j1xlte_defconfig

          # Step 2: Patch .config directly for LZO + no DEBUG_INFO
          # CRITICAL: Do NOT run olddefconfig after this - it will revert LZO back to GZIP
          sed -i '/CONFIG_KERNEL_GZIP/d'  .config
          sed -i '/CONFIG_KERNEL_BZIP2/d' .config
          sed -i '/CONFIG_KERNEL_LZMA/d'  .config
          sed -i '/CONFIG_KERNEL_XZ/d'    .config
          sed -i '/CONFIG_KERNEL_LZ4/d'   .config
          sed -i '/CONFIG_KERNEL_LZO/d'   .config
          printf '\n# CONFIG_KERNEL_GZIP is not set\nCONFIG_KERNEL_LZO=y\nCONFIG_HAVE_KERNEL_LZO=y\nCONFIG_RD_LZO=y\n' >> .config

          # Disable debug info (saves ~1MB)
          sed -i '/CONFIG_DEBUG_INFO/d' .config
          printf '\n# CONFIG_DEBUG_INFO is not set\n' >> .config

          # Step 3: Verify (for log)
          echo "=== Active kernel compression ==="
          grep -E "CONFIG_KERNEL_(GZIP|LZO|XZ|LZ4|BZIP2|LZMA)" .config

          # Step 4: Build directly - NO olddefconfig (it reverts LZO→GZIP via Kconfig selects)
          make -j$(nproc) zImage
          make -j$(nproc) dtbs

          echo "=== Final zImage size ==="
          ls -lh arch/arm/boot/zImage

      - name: Upload Compact Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zImage-Camera-Compact
          path: |
            kernel/arch/arm/boot/zImage
            kernel/arch/arm/boot/dts/*.dtb
