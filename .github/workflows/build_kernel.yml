name: Build Android 14 Kernel for Galaxy J1 2016

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev bison flex libssl-dev bc ccache git lzop

      - name: Clone Google Android GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain

      - name: Clone Exynos 3475 Kernel Source
        run: |
          git clone --depth=1 https://github.com/Exynos3475/android_kernel_samsung_exynos3475.git -b lineage-17.1 kernel

      - name: Apply Android 14 SELinux & Syscall Patches
        run: |
          cd kernel
          # Allow SELinux Policy version 34 (Android 14)
          sed -i 's/#define POLICYDB_VERSION_MAX.*/#define POLICYDB_VERSION_MAX 34/g' security/selinux/ss/policydb.h
          # Enable permissive mode in kernel config
          sed -i 's/CONFIG_SECURITY_SELINUX_DEVELOP=y/CONFIG_SECURITY_SELINUX_DEVELOP=y\nCONFIG_SECURITY_SELINUX_BOOTPARAM=y\nCONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0/g' arch/arm/configs/lineage-j1xlte_defconfig

      - name: Compile Kernel zImage
        run: |
          cd kernel
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androidkernel-
          make lineage-j1xlte_defconfig
          make -j$(nproc) zImage

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zImage-Android14
          path: kernel/arch/arm/boot/zImage
