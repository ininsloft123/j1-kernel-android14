name: Build Lightweight Android 12 Kernel with Camera Fix

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev bison flex libssl-dev bc ccache git lzop lz4 xz-utils device-tree-compiler

      - name: Clone Google Android GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain

      - name: Clone kOtusin Lineage 19.1 Kernel Source
        run: |
          git clone --depth=1 https://github.com/kOtusin/android_kernel_samsung_exynos3475.git -b lineage-19.1 kernel

      - name: Apply Camera FLITE IRQ Sharing, DTS Standby & Size Trimming
        run: |
          cd kernel

          # 1. Patch Camera FIMC-IS FLITE IRQF_SHARED (fixes FD leak on /dev/video101)
          find drivers/media/ -name "*flite*.c" -exec sed -i 's/request_irq(\([^,]*\), \([^,]*\), 0,/request_irq(\1, \2, IRQF_SHARED,/g' {} +
          find drivers/media/ -name "*sensor*.c" -exec sed -i 's/request_irq(\([^,]*\), \([^,]*\), 0,/request_irq(\1, \2, IRQF_SHARED,/g' {} +

          # 2. Patch Device Tree Camera GPIO Standby Pins to GPF0
          find arch/arm/boot/dts/ -name "*3475*.dts*" -exec sed -i 's/gpio_standby = <&gpc2 [0-9] [0-9]>/gpio_standby = <\&gpf0 2 1>/g' {} +

          # 3. Strip heavy debug features from defconfig to keep zImage <= 4.8MB
          DEFCONFIG="arch/arm/configs/lineage-j1xlte_defconfig"

          # Disable FTRACE & Function Graph Tracing (Saves ~700KB)
          sed -i '/CONFIG_FTRACE/d' $DEFCONFIG
          sed -i '/CONFIG_FUNCTION_TRACER/d' $DEFCONFIG
          sed -i '/CONFIG_DYNAMIC_FTRACE/d' $DEFCONFIG
          sed -i '/CONFIG_FUNCTION_GRAPH_TRACER/d' $DEFCONFIG
          echo "# CONFIG_FTRACE is not set" >> $DEFCONFIG

          # Disable Debug info & Lockdep (Saves ~400KB)
          sed -i '/CONFIG_DEBUG_INFO/d' $DEFCONFIG
          sed -i '/CONFIG_DEBUG_KERNEL/d' $DEFCONFIG
          sed -i '/CONFIG_LOCKDEP/d' $DEFCONFIG
          sed -i '/CONFIG_PROVE_LOCKING/d' $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO is not set" >> $DEFCONFIG
          echo "# CONFIG_LOCKDEP is not set" >> $DEFCONFIG

          # Disable exFAT & unused filesystems
          sed -i '/CONFIG_EXFAT_FS/d' $DEFCONFIG
          echo "# CONFIG_EXFAT_FS is not set" >> $DEFCONFIG

          # Disable unused DVB / TV tuners in media
          sed -i '/CONFIG_DVB/d' $DEFCONFIG
          echo "# CONFIG_DVB_CORE is not set" >> $DEFCONFIG

      - name: Compile Lightweight Kernel and DTBs
        run: |
          cd kernel
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          make lineage-j1xlte_defconfig
          make -j$(nproc) zImage
          make -j$(nproc) dtbs

          echo "=== Final zImage size ==="
          ls -lh arch/arm/boot/zImage

      - name: Upload Lightweight Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zImage-Camera-Lightweight
          path: |
            kernel/arch/arm/boot/zImage
            kernel/arch/arm/boot/dts/*.dtb
